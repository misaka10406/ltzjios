name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Locate project
        shell: bash
        run: |
          if [[ -d LTZJ.xcodeproj ]]; then
            echo 'PROJECT_DIR=.' >> "$GITHUB_ENV"
          elif [[ -d ios-client/LTZJ.xcodeproj ]]; then
            echo 'PROJECT_DIR=ios-client' >> "$GITHUB_ENV"
          else
            echo 'LTZJ.xcodeproj not found' >&2
            exit 1
          fi
      - name: Regression test ZIP64 offset-only entries
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 tests/create-offset64-zip.py "$RUNNER_TEMP/offset64.zip"
          swift run --package-path Vendor/ZIPFoundationPatched ZIP64Regression "$RUNNER_TEMP/offset64.zip"
          rm "$RUNNER_TEMP/offset64.zip"
      - name: Build device archive without signing
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          xcodebuild -version
          plutil -lint LTZJ/Info.plist LTZJ/PrivacyInfo.xcprivacy LTZJ.xcodeproj/project.pbxproj
          xcodebuild -resolvePackageDependencies -project LTZJ.xcodeproj -scheme LTZJ
          xcodebuild -project LTZJ.xcodeproj -scheme LTZJ -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/LTZJ.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive \
            | tee "$RUNNER_TEMP/xcodebuild.log"
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$RUNNER_TEMP/LTZJ.xcarchive/Products/Applications/LTZJ.app" "$RUNNER_TEMP/ipa/Payload/LTZJ.app"
          cd "$RUNNER_TEMP/ipa"
          ditto -c -k --keepParent Payload LTZJ-unsigned.ipa
          shasum -a 256 LTZJ-unsigned.ipa > SHA256SUMS.txt
          echo 'Unsigned IPA: requires valid iOS signing before device installation.' > README.txt
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LTZJ-unsigned-IPA
          path: |
            ${{ runner.temp }}/ipa/LTZJ-unsigned.ipa
            ${{ runner.temp }}/ipa/SHA256SUMS.txt
            ${{ runner.temp }}/ipa/README.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
